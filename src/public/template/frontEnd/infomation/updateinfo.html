        <h1 class="info-title">Thông tin các nhân </h1>
        <div class="info-profile">
            <label for="name" class="info-user">Họ tên</label>
            <div class="info-input">
                <input type="text" name="name" id="name" placeholder="Nhập tên" class="info-input-value">
            </div>
        </div>
        <div class="info-profile">
            <label for="email" class="info-user">E-mail</label>
            <div class="info-input">
                <input type="email" name="email" id="email" placeholder="Nhập email" class="info-input-value">
            </div>
        </div>
        <div class="info-profile">
            <label for="phone" class="info-user">Số điện thoại</label>
            <div class="info-input">
                <input type="text" name="phone" id="phone" placeholder="Nhập số điện thoại" class="info-input-value">
            </div>
        </div>
        <div class="info-profile">
            <label for="gender" class="info-user">Giới tính</label>
            <div class="info-gender">
                <label for="gender_male" class="info-gender-radio">
                    <input type="radio" name="gender" id="gender_male" value="0">
                    <span>Nam</span>
                </label>
                <label for="gender_female" class="info-gender-radio">
                    <input type="radio" name="gender" id="gender_female" value="1">
                    <span>Nữ</span>
                </label>
            </div>
        </div>
        <div class="info-profile">
            <label for="info-dayOfBirth" class="info-user">Ngày sinh</label>
        
                <input type="date" name="info-date" id="info-dayOfBirt" class="info-input-value">
